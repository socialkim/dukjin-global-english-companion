name: Verify and package extension

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - run: zip -r dukjin-global-extension-v0.2.1.zip manifest.json background.js content.js sidepanel
      - uses: actions/upload-artifact@v4
        with:
          name: dukjin-global-extension-v0.2.1
          path: dukjin-global-extension-v0.2.1.zip
